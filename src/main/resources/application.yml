server:
  # Render (and most PaaS) inject PORT; local dev uses SERVER_PORT.
  port: ${PORT:${SERVER_PORT:8081}}
  shutdown: graceful

spring:
  application:
    name: typerush-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/typerush?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER:typerush}
    password: ${DB_PASSWORD:typerush}
    hikari:
      # Shared/free MySQL hosts cap concurrent connections, so stay small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
      pool-name: typerush-pool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.typerush: INFO
    org.hibernate.SQL: WARN

typerush:
  game:
    # Minimum racers before a room may start. 1 lets a lone player race solo and still get a full
    # result; quick match still waits for `quick-match.pair-size` opponents before pairing anyone.
    min-players: 1
    # Max players in one room (group race).
    max-players: 8
    # Length in characters of a race text.
    text-length: 220
    # Countdown before the race begins, in ms.
    countdown-ms: 4000
    # How often live progress snapshots are broadcast to the room, in ms.
    tick-ms: 100
    # Hard time limit for a race, in ms (after which remaining players DNF).
    time-limit-ms: 180000
    # Grace period after the first finisher before the race is closed out.
    finish-grace-ms: 8000
    # Anti-cheat: fastest plausible gross WPM. Anything above is clamped/flagged.
    max-wpm: 260
    # Share of the room used for auto matchmaking.
    quick-match:
      enabled: true
      pair-size: 2
      # Pause before looking for new opponents again after a quick match.
      rematch-delay-ms: 4000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
  auth:
    # Override in production: Render dashboard -> Environment -> AUTH_JWT_SECRET
    # Must be at least 32 characters.
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-anywhere}
    access-ttl-seconds: ${AUTH_ACCESS_TTL:900}
    refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:30}
    bcrypt-cost: ${AUTH_BCRYPT_COST:12}
    login-attempts-per-ip: ${AUTH_LOGIN_PER_IP:20}
    login-attempts-per-user: ${AUTH_LOGIN_PER_USER:8}
    registrations-per-ip: ${AUTH_REGISTER_PER_IP:5}
    sockets-per-account: ${AUTH_SOCKETS_PER_ACCOUNT:4}
    rooms-per-hour: ${AUTH_ROOMS_PER_HOUR:30}
    limit-cooldown-seconds: ${AUTH_LIMIT_COOLDOWN:900}